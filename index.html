<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventario MJK - Android</title>
  <!-- Tailwind CSS para interfaz responsiva -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Librería ZXing para escaneo de código de barras con la cámara -->
  <script src="https://unpkg.com/@zxing/library@latest"></script>
  <style>
    .badge-out {
      background-color: #fee2e2;
      color: #dc2626;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
    }
    .badge-in {
      background-color: #dcfce7;
      color: #16a34a;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
    }
    .product-card.out-of-stock {
      border-left: 5px solid #dc2626;
      background-color: #fef2f2;
    }
  </style>
</head>
<body class="bg-gray-100 font-sans min-h-screen">

  <!-- ==================== MÓDULO DE AUTENTICACIÓN (LOGIN) ==================== -->
  <div id="authContainer" class="flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-6 rounded-xl shadow-md w-full max-w-sm">
      <h2 id="authTitle" class="text-2xl font-bold text-center text-blue-600 mb-6">Iniciar Sesión</h2>
      
      <!-- Formulario Login -->
      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">Usuario</label>
          <input type="text" id="loginUser" required placeholder="Ej: MJK" class="w-full p-2 border rounded-lg text-sm">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">Contraseña</label>
          <input type="password" id="loginPass" required placeholder="password" class="w-full p-2 border rounded-lg text-sm">
        </div>
        <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg font-bold text-sm shadow hover:bg-blue-700">
          Ingresar
        </button>
        <p class="text-xs text-center text-gray-500 mt-4">
          ¿No tienes cuenta? <a href="#" onclick="toggleAuthMode(true)" class="text-blue-600 font-bold">Regístrate aquí</a>
        </p>
      </form>

      <!-- Formulario Registro -->
      <form id="registerForm" onsubmit="handleRegister(event)" class="space-y-4 hidden">
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">Nuevo Usuario</label>
          <input type="text" id="regUser" required placeholder="Nombre de usuario" class="w-full p-2 border rounded-lg text-sm">
        </div>
        <div>
          <label class="block text-xs font-bold text-gray-700 mb-1">Nueva Contraseña</label>
          <input type="password" id="regPass" required placeholder="password" class="w-full p-2 border rounded-lg text-sm">
        </div>
        <div>
          <label class="block text-xs font-bold text-red-600 mb-1">Clave MJK de Autorización</label>
          <input type="password" id="regAuthKey" required placeholder="Autorizacion" class="w-full p-2 border border-red-300 rounded-lg text-sm">
        </div>
        <button type="submit" class="w-full bg-green-600 text-white py-2 rounded-lg font-bold text-sm shadow hover:bg-green-700">
          Crear Cuenta
        </button>
        <p class="text-xs text-center text-gray-500 mt-4">
          ¿Ya tienes cuenta? <a href="#" onclick="toggleAuthMode(false)" class="text-blue-600 font-bold">Inicia Sesión</a>
        </p>
      </form>
    </div>
  </div>

  <!-- ==================== MÓDULO DE INVENTARIO ==================== -->
  <div id="appContainer" class="hidden">
    <!-- Encabezado con Botón Salir -->
    <header class="bg-blue-600 text-white p-4 flex justify-between items-center shadow-md sticky top-0 z-10">
      <div>
        <h1 class="text-lg font-bold">Control de Inventario</h1>
        <p id="userBadge" class="text-xs text-blue-200"></p>
      </div>
      <button onclick="logout()" class="bg-blue-800 text-xs px-3 py-1.5 rounded-lg border border-blue-400">
        🚪 Salir
      </button>
    </header>

    <main class="p-4 max-w-md mx-auto pb-10">
      <!-- Buscador y Botón Agregar -->
      <div class="flex gap-2 mb-4">
        <input type="text" id="searchInput" oninput="filterProducts()" placeholder="Buscar por nombre o código..." class="flex-1 p-2 border rounded-lg text-sm shadow-sm">
        <button onclick="openModal()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-bold shadow-sm">+ Nuevo</button>
      </div>

      <!-- Lector de Cámara -->
      <div id="scannerContainer" class="hidden mb-4 bg-black p-2 rounded-lg text-center">
        <video id="video" class="w-full h-48 object-cover rounded-lg"></video>
        <button onclick="stopScanner()" class="mt-2 bg-red-600 text-white px-4 py-1 rounded text-sm">Cerrar Escáner</button>
      </div>

      <!-- Lista de Productos -->
      <div id="productList" class="space-y-3"></div>
    </main>

    <!-- Modal Formulario Agregar/Editar -->
    <div id="productModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4 z-20">
      <div class="bg-white rounded-lg p-5 w-full max-w-md max-h-[90vh] overflow-y-auto">
        <h2 id="modalTitle" class="text-lg font-bold mb-4">Agregar Producto</h2>
        
        <form id="productForm" onsubmit="saveProduct(event)">
          <input type="hidden" id="prodId">
          
          <div class="mb-3">
            <label class="block text-xs font-bold text-gray-700 mb-1">Código de Barras</label>
            <div class="flex gap-2">
              <input type="text" id="prodCode" required class="flex-1 p-2 border rounded text-sm">
              <button type="button" onclick="startScanner()" class="bg-gray-800 text-white px-3 py-2 rounded text-xs">📷 Escanear</button>
            </div>
          </div>

          <div class="mb-3">
            <label class="block text-xs font-bold text-gray-700 mb-1">Nombre del Artículo</label>
            <input type="text" id="prodName" required class="w-full p-2 border rounded text-sm">
          </div>

          <div class="mb-3">
            <label class="block text-xs font-bold text-gray-700 mb-1">Descripción</label>
            <textarea id="prodDesc" rows="2" class="w-full p-2 border rounded text-sm"></textarea>
          </div>

          <div class="mb-3">
            <label class="block text-xs font-bold text-gray-700 mb-1">Cantidad</label>
            <input type="number" id="prodQty" min="0" required class="w-full p-2 border rounded text-sm">
          </div>

          <div class="mb-4">
            <label class="block text-xs font-bold text-gray-700 mb-1">Imagen del Artículo</label>
            <input type="file" id="prodImage" accept="image/*" capture="environment" onchange="previewImage(event)" class="w-full text-xs">
            <img id="imgPreview" class="mt-2 w-20 h-20 object-cover rounded hidden border">
          </div>

          <!-- Botones del Formulario -->
          <div class="flex justify-between items-center pt-2 border-t">
            <!-- Botón Eliminar: solo visible si el usuario activo es MJK -->
            <button type="button" id="deleteBtn" onclick="deleteCurrentProduct()" class="bg-red-100 text-red-600 px-3 py-2 rounded text-xs font-bold hidden border border-red-200">
              🗑️ Eliminar
            </button>
            
            <div class="flex gap-2 ml-auto">
              <button type="button" onclick="closeModal()" class="px-4 py-2 border rounded text-sm">Cancelar</button>
              <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded text-sm font-bold">Guardar</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script>
    // Base de Datos de Usuarios (Inicializa a MJK con clave 61978)
    let usersDB = JSON.parse(localStorage.getItem('app_users')) || [
      { username: 'MJK', pass: '61978HD' }
    ];

    let currentUser = localStorage.getItem('app_logged_user') || null;
    let inventory = JSON.parse(localStorage.getItem('android_inventory')) || [];
    let codeReader = null;
    let currentImageData = "";

    // Inicializar la aplicación
    document.addEventListener('DOMContentLoaded', () => {
      saveUsersDB();
      if (currentUser) {
        showApp();
      } else {
        showAuth();
      }
    });

    function saveUsersDB() {
      localStorage.setItem('app_users', JSON.stringify(usersDB));
    }

    // Alternar entre Formulario de Login y Registro
    function toggleAuthMode(isRegister) {
      document.getElementById('loginForm').classList.toggle('hidden', isRegister);
      document.getElementById('registerForm').classList.toggle('hidden', !isRegister);
      document.getElementById('authTitle').innerText = isRegister ? 'Registro de Usuario' : 'Iniciar Sesión';
    }

    // Procesar Inicio de Sesión
    function handleLogin(e) {
      e.preventDefault();
      const user = document.getElementById('loginUser').value.trim();
      const pass = document.getElementById('loginPass').value.trim();

      const found = usersDB.find(u => u.username.toLowerCase() === user.toLowerCase() && u.pass === pass);

      if (found) {
        currentUser = found.username; // Guardar el nombre exacto con el que inició sesión
        localStorage.setItem('app_logged_user', currentUser);
        showApp();
      } else {
        alert("Usuario o contraseña incorrectos.");
      }
    }

    // Procesar Registro de Nuevo Usuario
    function handleRegister(e) {
      e.preventDefault();
      const user = document.getElementById('regUser').value.trim();
      const pass = document.getElementById('regPass').value.trim();
      const authKey = document.getElementById('regAuthKey').value.trim();

      // Validar la Clave MJK
      if (authKey !== '61978HD') {
        alert("Clave MJK de autorización incorrecta.");
        return;
      }

      // Validar usuario existente
      if (usersDB.some(u => u.username.toLowerCase() === user.toLowerCase())) {
        alert("El nombre de usuario ya existe.");
        return;
      }

      // Registrar usuario
      usersDB.push({ username: user, pass: pass });
      saveUsersDB();
      alert("¡Cuenta creada con éxito! Ahora puedes iniciar sesión.");
      toggleAuthMode(false);
    }

    // Mostrar Interfaz de Inventario
    function showApp() {
      document.getElementById('authContainer').classList.add('hidden');
      document.getElementById('appContainer').classList.remove('hidden');
      document.getElementById('userBadge').innerText = `Usuario: ${currentUser}`;
      renderProducts();
    }

    // Mostrar Interfaz de Login
    function showAuth() {
      document.getElementById('authContainer').classList.remove('hidden');
      document.getElementById('appContainer').classList.add('hidden');
    }

    // Cerrar Sesión
    function logout() {
      currentUser = null;
      localStorage.removeItem('app_logged_user');
      showAuth();
    }

    // Guardar cambios del inventario
    function saveToStorage() {
      localStorage.setItem('android_inventory', JSON.stringify(inventory));
    }

    // Renderizar Productos
    function renderProducts(items = inventory) {
      const container = document.getElementById('productList');
      container.innerHTML = '';

      if (items.length === 0) {
        container.innerHTML = `<p class="text-center text-gray-500 my-8 text-sm">No hay artículos registrados.</p>`;
        return;
      }

      items.forEach(prod => {
        const isOut = prod.quantity <= 0;
        const card = document.createElement('div');
        card.className = `bg-white p-3 rounded-lg shadow-sm flex gap-3 items-center product-card ${isOut ? 'out-of-stock' : ''}`;
        
        const badge = isOut 
          ? `<span class="badge-out">AGOTADO</span>` 
          : `<span class="badge-in">Stock: ${prod.quantity}</span>`;

        const imgHtml = prod.image 
          ? `<img src="${prod.image}" class="w-16 h-16 object-cover rounded">`
          : `<div class="w-16 h-16 bg-gray-200 rounded flex items-center justify-center text-gray-400 text-xs">Sin Foto</div>`;

        card.innerHTML = `
          ${imgHtml}
          <div class="flex-1 min-w-0">
            <div class="flex justify-between items-start mb-1">
              <h3 class="font-bold text-sm truncate">${prod.name}</h3>
              ${badge}
            </div>
            <p class="text-xs text-gray-500 mb-1">Código: ${prod.code}</p>
            <p class="text-xs text-gray-600 truncate">${prod.description || 'Sin descripción'}</p>
            
            <div class="flex items-center gap-2 mt-2">
              <button onclick="updateQty('${prod.id}', -1)" ${isOut ? 'disabled style="opacity:0.4;"' : ''} class="bg-gray-200 w-7 h-7 rounded text-sm font-bold flex items-center justify-center">-</button>
              <span class="text-sm font-bold w-6 text-center">${prod.quantity}</span>
              <button onclick="updateQty('${prod.id}', 1)" class="bg-gray-200 w-7 h-7 rounded text-sm font-bold flex items-center justify-center">+</button>
              <button onclick="editProduct('${prod.id}')" class="ml-auto text-xs text-blue-600 font-semibold border border-blue-200 px-2 py-1 rounded">Editar</button>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Actualizar Cantidades
    function updateQty(id, delta) {
      const prod = inventory.find(p => p.id === id);
      if (prod) {
        prod.quantity = Math.max(0, prod.quantity + delta);
        saveToStorage();
        renderProducts();
      }
    }

    // Control de Modal
    function openModal() {
      document.getElementById('productForm').reset();
      document.getElementById('prodId').value = '';
      document.getElementById('imgPreview').classList.add('hidden');
      document.getElementById('deleteBtn').classList.add('hidden');
      currentImageData = "";
      document.getElementById('modalTitle').innerText = "Agregar Producto";
      document.getElementById('productModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('productModal').classList.add('hidden');
      stopScanner();
    }

    // Editar Producto (Verificación de Permisos para MJK)
    function editProduct(id) {
      const prod = inventory.find(p => p.id === id);
      if (!prod) return;

      document.getElementById('prodId').value = prod.id;
      document.getElementById('prodCode').value = prod.code;
      document.getElementById('prodName').value = prod.name;
      document.getElementById('prodDesc').value = prod.description;
      document.getElementById('prodQty').value = prod.quantity;
      
      const preview = document.getElementById('imgPreview');
      if (prod.image) {
        preview.src = prod.image;
        preview.classList.remove('hidden');
        currentImageData = prod.image;
      } else {
        preview.classList.add('hidden');
        currentImageData = "";
      }

      document.getElementById('modalTitle').innerText = "Editar Producto";

      // RESTRICCIÓN DE PERMISOS: Solo mostrar el botón de eliminar si el usuario es MJK
      const deleteBtn = document.getElementById('deleteBtn');
      if (currentUser && currentUser.toUpperCase() === 'MJK') {
        deleteBtn.classList.remove('hidden');
      } else {
        deleteBtn.classList.add('hidden');
      }

      document.getElementById('productModal').classList.remove('hidden');
    }

    function saveProduct(e) {
      e.preventDefault();
      const id = document.getElementById('prodId').value || Date.now().toString();
      const code = document.getElementById('prodCode').value.trim();
      const name = document.getElementById('prodName').value.trim();
      const description = document.getElementById('prodDesc').value.trim();
      const quantity = parseInt(document.getElementById('prodQty').value) || 0;

      const existingIndex = inventory.findIndex(p => p.id === id);
      const newProduct = { id, code, name, description, quantity, image: currentImageData };

      if (existingIndex > -1) {
        if (!currentImageData) newProduct.image = inventory[existingIndex].image;
        inventory[existingIndex] = newProduct;
      } else {
        inventory.push(newProduct);
      }

      saveToStorage();
      renderProducts();
      closeModal();
    }

    // Función de Eliminación con Validación de Seguridad
    function deleteCurrentProduct() {
      // Validación adicional de seguridad
      if (!currentUser || currentUser.toUpperCase() !== 'MJK') {
        alert("Acceso denegado. Solo el usuario MJK tiene permisos para eliminar artículos.");
        return;
      }

      const id = document.getElementById('prodId').value;
      const name = document.getElementById('prodName').value;

      if (!id) return;

      if (confirm(`¿Estás seguro de que deseas eliminar "${name}" del inventario?`)) {
        inventory = inventory.filter(p => p.id !== id);
        saveToStorage();
        renderProducts();
        closeModal();
      }
    }

    function previewImage(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 300;
            canvas.height = 300;
            ctx.drawImage(img, 0, 0, 300, 300);
            currentImageData = canvas.toDataURL('image/jpeg', 0.7);
            
            const preview = document.getElementById('imgPreview');
            preview.src = currentImageData;
            preview.classList.remove('hidden');
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    }

    function filterProducts() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = inventory.filter(p => 
        p.name.toLowerCase().includes(query) || p.code.toLowerCase().includes(query)
      );
      renderProducts(filtered);
    }

    function startScanner() {
      document.getElementById('scannerContainer').classList.remove('hidden');
      codeReader = new ZXing.BrowserMultiFormatReader();
      codeReader.decodeFromVideoDevice(null, 'video', (result, err) => {
        if (result) {
          document.getElementById('prodCode').value = result.text;
          stopScanner();
        }
      });
    }

    function stopScanner() {
      if (codeReader) {
        codeReader.reset();
        codeReader = null;
      }
      document.getElementById('scannerContainer').classList.add('hidden');
    }
  </script>
</body>
</html>
